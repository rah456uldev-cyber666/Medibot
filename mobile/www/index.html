<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Offline medical information app based on The Gale Encyclopedia of Medicine">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Medibot">
  <title>Medibot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/chat"><img src="icons/icon-192.png" alt="" width="28" height="28"> Medibot</a>
    <button id="status" class="status" type="button" title="Connection mode"></button>
  </header>
  <main id="view" class="container" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/chat" data-tab="chat"><span>💬</span>Chat</a>
    <a href="#/library" data-tab="library"><span>📚</span>Library</a>
    <a href="#/checker" data-tab="checker"><span>🩺</span>Symptoms</a>
    <a href="#/settings" data-tab="settings"><span>⚙️</span>Settings</a>
  </nav>
  <noscript>Medibot needs JavaScript to run.</noscript>
  <script src="config.js"></script>
  <script src="data/diseases.js"></script>
  <script src="js/core.js"></script>
  <script src="js/search.js"></script>
  <script src="js/answer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
