# Builds the Medibot Android app (APK) in the cloud, for free, on every push.
# Download it from: GitHub repo > Actions > latest "Build Android APK" run > Artifacts > medibot-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/build-android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Medibot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medibot-apk
          path: mobile/Medibot.apk
